[project]
name = "ff-model"
version = "0.1.0"
description = "Start/sit decision model for an ESPN H2H league"
authors = [
    { name = "JY-H", email = "jiayan.a.hu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "espn-api>=1.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
ff-archive = "ff_model.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
