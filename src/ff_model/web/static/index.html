<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFModel</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --me: #2a78d6; --me-soft: #cde2fb; --opp: #eb6834; --opp-soft: #fbdccd;
  --win: #2a78d6; --loss: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --chip: #eeede9; --hl: #fff5d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
    --me: #3987e5; --me-soft: #1c3a5f; --opp: #d95926; --opp-soft: #4a2a1c;
    --win: #3987e5; --loss: #e66767; --chip: #2a2a27; --hl: #3a3420;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh; padding: 0 24px 56px; }
.viz-root > * { max-width: 1680px; margin-left: auto; margin-right: auto; }
.appbar { position: sticky; top: 0; z-index: 15; background: color-mix(in srgb, var(--surface-0) 92%, transparent);
  backdrop-filter: blur(8px); padding-top: 18px; margin-bottom: 4px; }
.brand .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--me); }
.brand .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 0; }
h2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 32px 0 10px; }
h3 { font-size: 15px; font-weight: 650; margin: 16px 0 8px; } .card > h3:first-child { margin-top: 0; }
.intro { font-size: 13px; color: var(--text-secondary); line-height: 1.55; max-width: 1000px; margin: 14px 0 12px; }
.muted { color: var(--text-muted); } .secondary { color: var(--text-secondary); } .small { font-size: 12px; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
select, button, input { font: inherit; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); }
button { cursor: pointer; } button:disabled { opacity: .5; cursor: wait; }
button.primary { background: var(--me); color: #fff; border-color: var(--me); }
.tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--text-secondary); font-weight: 500; white-space: nowrap; }
.tabs button:hover { color: var(--text-primary); }
.tabs button.on { color: var(--text-primary); border-bottom-color: var(--me); font-weight: 650; }
.dtabs button.on { border-bottom-color: var(--text-primary); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { background: var(--chip); color: var(--text-secondary); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.chip.link.stack { box-shadow: inset 0 0 0 1px var(--me); } .chip.link.hedge { box-shadow: inset 0 0 0 1px var(--good); }
.chip.link.risk { box-shadow: inset 0 0 0 1px var(--critical); }
.chip.status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--dot); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; }
.tile .label { color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; } .tile .value { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin-top: 4px; }
.tile .sub { color: var(--text-muted); font-size: 12px; }
tr.hl td { background: var(--hl); }
.tradecard { margin-top: 14px; } .tradecard .thead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tradecard .pill { padding: 2px 8px; border-radius: 6px; font-weight: 650; font-size: 13px; white-space: nowrap; }
.tside { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
.story .srow { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--grid); line-height: 1.5; }
.story .srow:last-child { border-bottom: none; }
.story .srow > b { font-size: 13px; } .story .pill { display: inline-block; padding: 0 5px; border-radius: 5px; font-weight: 600; font-size: 12px; }
.story .why { margin-top: 3px; font-size: 12.5px; color: var(--text-secondary); }
.story .why div::before { content: "→ "; color: var(--text-muted); }
.story .up { color: var(--win); } .story .down { color: var(--loss); }
@media (max-width: 700px) { .hide-sm { display: none; } }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child > td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pname { font-weight: 600; } .pmeta { font-size: 12px; color: var(--text-muted); }
.nc { display: flex; align-items: center; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
.nc.opp { flex-direction: row-reverse; } .nc.opp .nm { text-align: right; }
.nc .nm { flex-shrink: 0; } .nc .pname, .nc .pmeta { white-space: nowrap; }
.nc .tags { flex-wrap: wrap; flex-shrink: 1; min-width: 0; } .nc .tags .chip { white-space: nowrap; }
.nc .tags { justify-content: flex-end; max-width: 60%; } .nc.opp .tags { justify-content: flex-start; }
.rngcell { width: 1%; white-space: nowrap; padding-left: 4px; padding-right: 4px; }
.clickable { cursor: pointer; } .clickable:hover { background: var(--grid); }
.h2h td.slot { text-align: center; font-weight: 600; color: var(--text-secondary); font-size: 12px; background: var(--surface-0); width: 52px; }
.h2h td, .h2h th { padding-left: 4px; padding-right: 4px; } .h2h th { text-transform: none; letter-spacing: 0; font-size: 12px; }
.card.h2hcard { padding: 10px 12px; }
.h2h td.r { text-align: right; } .h2h .rec { box-shadow: inset 3px 0 0 var(--me); }
.three tr.diffrow td:not([style*="background"]) { background: var(--hl); } .ctr { text-align: center; }
table.bygame { border-collapse: separate; border-spacing: 0; }
table.bygame tr.gap td { height: 14px; border: none; padding: 0; }
table.bygame tr.gamehdr td { background: var(--chip); border: none; padding: 9px 12px; border-radius: 8px 8px 0 0; }
table.bygame tr.gamehdr .gm { font-size: 15px; font-weight: 700; letter-spacing: .2px; margin-right: 10px; }
table.bygame tr.gamehdr .gd { font-size: 12px; color: var(--text-secondary); }
table.bygame tr.prow td:first-child { padding-left: 26px; }
table.bygame tr.prow .pname { font-weight: 500; }
table.bygame tr.prow td { border-bottom: 1px solid var(--grid); }
.hero { margin-top: 10px; } .herotop { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
.hero .label { color: var(--text-secondary); font-size: 12px; display: block; } .hero .big { font-size: 40px; font-weight: 700; line-height: 1.1; }
.hero .sub { color: var(--text-muted); font-size: 12px; } .statrow { display: flex; gap: 22px; flex-wrap: wrap; }
.statrow b, .happened b { font-size: 18px; display: block; } .happened { border-left: 1px solid var(--border); padding-left: 18px; }
.act { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-0); border-left: 4px solid var(--me); }
.act.ok { border-left-color: var(--good); } .act.bad { border-left-color: var(--critical); }
.swaps { border-left: 4px solid var(--me); } .swaps.ok { border-left-color: var(--good); }
.swaps.urgent { border-left-color: var(--critical); } tr.urgentrow td { background: color-mix(in srgb, var(--critical) 14%, transparent); }
.dsmall { font-size: 11px; color: var(--text-secondary); margin-left: 3px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); align-items: center; flex-wrap: wrap; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 30; max-width: 320px; }
.loading { padding: 50px; text-align: center; color: var(--text-secondary); }
.scroll { overflow-x: auto; }
.err { color: var(--critical); }
.banner { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--hl); font-size: 13px; }
aside#drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 100vw); background: var(--surface-1);
  border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.2); overflow-y: auto; padding: 18px 20px 40px;
  transform: translateX(105%); transition: transform .18s ease; z-index: 20; color: var(--text-primary); }
aside#drawer.open { transform: none; }
.dtabs { margin: 4px 0 12px; } .dtabs button { padding: 6px 10px; }
.pcard { background: var(--surface-0); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.pcard.sum { font-size: 15px; } .pcard .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ptitle { font-weight: 650; font-size: 13px; margin-bottom: 8px; color: var(--text-primary); }
.effbadge { font-weight: 650; padding: 2px 8px; border-radius: 6px; background: var(--chip); white-space: nowrap; }
.pcard .kv div { background: var(--surface-1); } .pcard details summary { color: var(--text-secondary); }
.pcard .ev { color: var(--text-muted); font-size: 12px; margin: 4px 0 0; }
.takeaway { line-height: 1.55; }
.factor { border-top: 1px solid var(--grid); padding: 8px 0; } .factor .hd { display: flex; justify-content: space-between; font-weight: 600; }
.factor p { margin: 4px 0; } .factor .ev { color: var(--text-muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.kv div { background: var(--surface-0); border-radius: 6px; padding: 6px 8px; } .kv b { display: block; font-size: 16px; }
body { overflow-x: hidden; } .card, #main { min-width: 0; }
@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr; } .viz-root { padding: 0 12px 40px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .value { font-size: 22px; }
  .bar label { width: 100%; display: flex; gap: 8px; align-items: center; } .bar select { flex: 1; min-width: 0; }
  .bar .spacer { display: none; } #fresh { width: 100%; }
}
.rk-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <header class="appbar">
  <div class="bar">
    <div class="brand"><div class="eyebrow">FFModel</div><h1 id="title">Weekly Matchup</h1><div class="subtitle" id="subtitle"></div></div>
    <span class="spacer"></span>
    <label class="small secondary">Week <select id="week"></select></label>
    <label class="small secondary">Team <select id="team"></select></label>
    <label class="small secondary" id="snapwrap">Snapshot <select id="snap"></select></label>
    <button id="fresh" title="Fetch ESPN projections, injuries and weather now (no odds credits)">Fresh snapshot</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="matchup" class="on">Weekly Matchup</button><button data-tab="context">Weekly Context</button><button data-tab="review">Weekly Review</button><button data-tab="season">Season Overview</button><button data-tab="trades">Trade Analyzer</button><button data-tab="rankings">Rankings</button>
  </div>
  </header>
  <div id="main"><div class="loading">Loading…</div></div>
  <aside id="drawer" aria-label="Player details"></aside>
  <div class="tip" id="tip"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const pct = (x, d = 0) => x == null ? "–" : (100 * x).toFixed(d) + "%";
const pts = (x, d = 1) => x == null || isNaN(x) ? "–" : Number(x).toFixed(d);
const sgn = (x, d = 1) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const when = iso => { if (!iso) return "–"; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}); };
const ago = iso => { if (!iso) return "–"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const tip = $("#tip");
const showTip = (e, h) => { tip.innerHTML = h; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px"; };
const hideTip = () => tip.style.display = "none";
const SLOTS = ["QB", "RB", "RB", "WR", "WR", "TE", "FLEX", "D/ST", "K"];
// Model vs ESPN: tint the whole cell (blue = model above ESPN, red = below; stronger = bigger gap).
// The signed difference is always written too, so color is never the only cue.
function tint(d, scale = 2.5) {
  if (d == null || isNaN(d) || Math.abs(d) < 0.1) return "";
  const a = Math.round(12 + 33 * Math.min(1, Math.abs(d) / scale));
  return `background: color-mix(in srgb, ${d > 0 ? "var(--win)" : "var(--loss)"} ${a}%, transparent);`;
}
const signed = d => d == null || isNaN(d) ? "" : Math.abs(d) < 0.1 ? `<span class="dsmall">±0</span>` : `<span class="dsmall">${sgn(d)}</span>`;
const whyTitle = p => { const e = Object.entries(p.effects || {}).filter(([, v]) => Math.abs(v) >= 0.1).map(([k, v]) => `${k} ${sgn(v)}`);
  return `Model ${pts(p.model_mean)} vs ESPN ${pts(p.proj)}` + (e.length ? `. Context: ${e.join(", ")}` : ". No context adjustments.") + " Click for details."; };
const modelTd = p => p.locked || p.unavailable ? `<td class="num">–</td>`
  : `<td class="num" title="${esc(whyTitle(p))}" style="${tint(p.model_mean - p.proj)}">${pts(p.model_mean)} ${signed(p.model_mean - p.proj)}</td>`;
const effectTd = d => `<td class="num" style="${tint(d)}">${Math.abs(d) < 0.1 ? "±0" : sgn(d)}</td>`;

const TAB_NAMES = {matchup: "Weekly Matchup", context: "Weekly Context", review: "Weekly Review", season: "Season Overview", trades: "Trade Analyzer", rankings: "Rankings"};
function setHeader(sub) { $("#title").textContent = TAB_NAMES[S.tab]; $("#subtitle").innerHTML = sub;
  document.title = `${TAB_NAMES[S.tab]} · FFModel`; }
const S = {weeks: [], teams: [], me: null, week: null, team: null, snapshot: null, tab: "matchup", report: null,
           overrides: {force_in: [], force_out: [], proj_delta: {}}};

function readHash() { const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ["week", "team", "snapshot"]) if (h.get(k)) S[k] = +h.get(k); if (h.get("tab")) S.tab = h.get("tab");
  if (h.get("player")) S.openPlayer = +h.get("player");
  if (h.get("ptab")) S.dtab = h.get("ptab"); if (h.get("rev")) S.revOpen = h.get("rev"); }
function writeHash() { const h = new URLSearchParams(); for (const k of ["week", "team", "snapshot"]) if (S[k]) h.set(k, S[k]);
  h.set("tab", S.tab); history.replaceState(null, "", "#" + h); }
const qs = () => { const p = new URLSearchParams(); if (S.week) p.set("week", S.week); if (S.team) p.set("team", S.team);
  if (S.snapshot) p.set("snapshot", S.snapshot); return p.toString(); };
async function getJSON(url, opts) { const r = await (await fetch(url, opts)).json(); if (r.error) throw new Error(r.error); return r; }

async function init() {
  readHash();
  const w = await getJSON("/api/weeks");
  S.weeks = w.weeks; S.teams = w.teams; S.me = w.me;
  S.team = S.team || w.me; S.week = S.week || S.weeks[S.weeks.length - 1].week;
  $("#team").innerHTML = S.teams.map(t => `<option value="${t.id}">${esc(t.name)}${t.id === S.me ? " (you)" : ""}</option>`).join("");
  $("#week").innerHTML = S.weeks.map(x => `<option value="${x.week}">Week ${x.week} · ${x.source === "live" ? "live" : "replay"}</option>`).join("");
  syncControls(); route();
}
function syncControls() {
  $("#team").value = S.team; $("#week").value = S.week;
  const wk = S.weeks.find(x => x.week === S.week), live = wk && wk.source === "live";
  $("#snapwrap").style.display = live ? "" : "none"; $("#fresh").style.display = live ? "" : "none";
  if (live) $("#snap").innerHTML = wk.snapshots.map(s => `<option value="${s.id}">#${s.id} · ${esc(s.slot_key ? s.slot_key.split("-").pop() : "manual")} · ${when(s.started_at)}</option>`).join("");
  if (S.snapshot) $("#snap").value = S.snapshot;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  const allWeeks = S.tab === "season" || S.tab === "trades";  // these views cover every week
  const pool = S.tab === "rankings";  // every player in this week's pool, no league or team
  $("#week").parentElement.style.display = allWeeks || pool ? "none" : "";
  $("#team").parentElement.style.display = pool ? "none" : "";
  if (allWeeks || pool) { $("#snapwrap").style.display = "none"; $("#fresh").style.display = "none"; }
}
$("#week").onchange = e => { S.week = +e.target.value; S.snapshot = null; resetOverrides(); syncControls(); route(); };
$("#team").onchange = e => { S.team = +e.target.value; resetOverrides(); route(); };
$("#snap").onchange = e => { S.snapshot = +e.target.value; resetOverrides(); route(); };
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; syncControls(); route(); });
$("#fresh").onclick = async () => { const b = $("#fresh"); b.disabled = true; b.textContent = "Taking snapshot…";
  try { const r = await getJSON("/api/snapshot", {method: "POST"}); const w = await getJSON("/api/weeks"); S.weeks = w.weeks;
        S.snapshot = r.snapshot_id; syncControls(); route(); } catch (e) { alert(e.message); }
  finally { b.disabled = false; b.textContent = "Fresh snapshot"; } };
function resetOverrides() { S.overrides = {force_in: [], force_out: [], proj_delta: {}}; }
const hasOverrides = () => S.overrides.force_in.length || S.overrides.force_out.length || Object.keys(S.overrides.proj_delta).length;

async function route() {
  writeHash(); closeDrawer();
  const main = $("#main");
  try {
    if (S.tab === "matchup") {
      main.innerHTML = `<div class="loading">Simulating the matchup 20,000 times…</div>`;
      S.report = hasOverrides()
        ? await getJSON("/api/whatif?" + qs(), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(S.overrides)})
        : await getJSON("/api/report?" + qs());
      renderMatchup(S.report);
      if (S.openPlayer) { const p = [...S.report.players.me, ...S.report.players.opp].find(x => x.id === S.openPlayer); S.openPlayer = null; openDrawer(p); }
    } else if (S.tab === "context") {
      main.innerHTML = `<div class="loading">Loading the week's context…</div>`;
      const [c, rep] = await Promise.all([getJSON("/api/context?" + qs()), getJSON("/api/report?" + qs())]);
      S.report = rep;
      renderContext(c, rep);
    } else if (S.tab === "trades") {
      main.innerHTML = `<div class="loading">Replaying each trade week by week…</div>`;
      renderTrades(await getJSON("/api/trades?" + qs()));
    } else if (S.tab === "rankings") {
      renderRankings();
    } else if (S.tab === "review") {
      main.innerHTML = `<div class="loading">Splitting each result into role and luck…</div>`;
      renderReview(await getJSON("/api/review?" + qs()));
    } else {
      main.innerHTML = `<div class="loading">Loading…</div>`;
      renderSeason(await getJSON("/api/tracking?" + qs()));
    }
  } catch (e) { main.innerHTML = `<div class="loading err">${esc(e.message)}</div>`; }
}

// ------------------------------------------------------------------ shared bits
// Links in a lineup, labelled from the estimated correlation of the two players' outcomes:
//   Stack  = your teammate in your lineup, rises/falls together (corr >= 0.05)
//   Hedge  = same game as an opponent's starter and moves WITH them (their big game partly offset)
//   Double risk = moves AGAINST an opponent's starter (e.g. your D/ST vs the QB it faces)
// Pairs with |corr| < 0.05 are not tagged.
const CUT = 0.05;
function linkItems(p) {
  const st = (p.stacks || []).filter(x => x.corr >= CUT).map(x => ({k: "stack", t: `Stack: ${x.name}`,
    full: `Same team as your ${x.name} (${x.pos}), correlation ${x.corr.toFixed(2)}: you rise and fall together (more upside, more risk).`}));
  const vs = (p.vs_opponent || []).filter(x => Math.abs(x.corr) >= CUT).map(x => x.corr > 0

function distSvg(p) {
  const q = p.quantiles;
  const ks = Object.keys(q).map(k => [parseFloat(k.slice(1)) / 100, q[k]]).sort((a, b) => a[0] - b[0]);
  // CDF through the model's percentiles (linear between them, short linear tails), as in the simulator
  const lo0 = ks[0][1] - (ks[1][1] - ks[0][1]) * ks[0][0] / (ks[1][0] - ks[0][0]);
  const n = ks.length, hi0 = ks[n - 1][1] + (ks[n - 1][1] - ks[n - 2][1]) * (1 - ks[n - 1][0]) / (ks[n - 1][0] - ks[n - 2][0]);
  const pts_ = [[0, lo0], ...ks, [1, hi0]];
  const F = v => { if (v <= pts_[0][1]) return 0; for (let i = 1; i < pts_.length; i++) { const [t0, v0] = pts_[i - 1], [t1, v1] = pts_[i];
      if (v <= v1) return v1 > v0 ? t0 + (t1 - t0) * (v - v0) / (v1 - v0) : t1; } return 1; };
  const lo = Math.floor(Math.min(0, lo0)), hi = Math.ceil(Math.max(hi0, p.proj + 5, 10));
  const step = 0.5, raw = []; for (let v = lo; v < hi; v += step) raw.push({a: v, m: F(v + step) - F(v)});
  const sig = Math.max(0.75, (hi - lo) / 60), w = Math.ceil(3 * sig / step);   // gentle smoothing, ~1-2 pts
  const sm = raw.map((r, i) => { let s = 0, z = 0; for (let j = -w; j <= w; j++) { const k = i + j; if (k < 0 || k >= raw.length) continue;
      const g = Math.exp(-0.5 * (j * step / sig) ** 2); s += g * raw[k].m; z += g; } return {a: r.a, m: s / z}; });
  const bins = []; for (let i = 0; i < sm.length; i += 2) bins.push({a: sm[i].a, b: sm[i].a + 1, m: sm[i].m + (sm[i + 1] ? sm[i + 1].m : 0)});
  const W = 500, H = 170, padB = 22, x = v => 8 + (W - 16) * (v - lo) / (hi - lo);
  const mmax = Math.max(...bins.map(b => b.m)), y = m => (H - padB) * (1 - m / mmax);
  const inner = b => b.a >= q.p10 - 0.5 && b.b <= q.p90 + 0.5;
  const bars = bins.map(b => `<rect class="dbar" data-a="${b.a}" data-b="${b.b}" data-m="${b.m}" x="${x(b.a) + 0.5}" y="${y(b.m)}" width="${Math.max(1, x(b.b) - x(b.a) - 1)}" height="${(H - padB) - y(b.m)}" rx="1" fill="${inner(b) ? "var(--me)" : "var(--me-soft)"}"/>`).join("");
  const ticks = []; const tstep = hi - lo > 40 ? 10 : 5; for (let v = Math.ceil(lo / tstep) * tstep; v <= hi; v += tstep) ticks.push(`<text x="${x(v)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--text-muted)">${v}</text>`);
  const mk = (v, label, dash) => `<line x1="${x(v)}" x2="${x(v)}" y1="14" y2="${H - padB}" stroke="var(--text-primary)" stroke-width="1.5" ${dash ? 'stroke-dasharray="3 3"' : ""}/><text x="${x(v) + 4}" y="11" font-size="11" fill="var(--text-secondary)">${label}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribution of ${esc(p.name)}'s points">${bars}
    <line x1="8" x2="${W - 8}" y1="${H - padB}" y2="${H - padB}" stroke="var(--border)"/>${ticks.join("")}
    ${mk(p.proj, "ESPN " + pts(p.proj))}${p.final != null ? mk(p.final, "final " + pts(p.final), true) : ""}</svg>
    <div class="legend"><span><svg width="12" height="12"><rect width="12" height="12" fill="var(--me)"/></svg> 80% range (10th–90th)</span>
      <span><svg width="12" height="12"><rect width="12" height="12" fill="var(--me-soft)"/></svg> tails</span><span>bar = chance of scoring in that 1-point band</span></div>`;
}

  $("#injq").oninput = e => { const v = e.target.value.toLowerCase(); document.querySelectorAll("#injt tr[data-k]").forEach(tr => tr.style.display = tr.dataset.k.includes(v) ? "" : "none"); };

// ------------------------------------------------------------------ season tab
function renderSeason(t) {

      <div class="card tile"><div class="label">Points: started vs model</div><div class="value">${pts(sum("actual_points"), 0)} / ${pts(sum("model_points"), 0)}</div><div class="sub">highest projection ${pts(sum("maxproj_points"), 0)}</div></div>
      <div class="card tile"><div class="label">Weeks the model would change something</div><div class="value">${w.filter(x => x.differs).length} of ${w.length}</div></div>
    </div>
    <div class="card scroll" style="margin-top:10px"><table>

      ${w.map(x => `<tr class="clickable" onclick="S.week=${x.week};S.tab='matchup';S.snapshot=null;syncControls();route()"><td>${x.week}</td><td>${esc(x.opponent)}</td>
        <td class="num">${pts(x.actual_points)}</td><td class="num">${pts(x.model_points)}</td><td class="num">${pts(x.maxproj_points)}</td><td class="num">${pts(x.opp_points)}</td>
        <td>${x.won ? "Won" : "Lost"}</td><td>${x.model_would_win ? "win" : "lose"}</td><td class="num">${pct(x.model_pwin)}</td><td class="small muted">${x.differs ? "model differs" : ""}</td></tr>`).join("")}

}
// Each finished week's margin split into projection + role + luck + K/DST (see the Weekly Review tab).
function marginsSection(m) {
  if (!m || !m.weeks.length) return "";
  return `<h2>Where each margin came from</h2>
    <p class="intro">Each final margin = the projected margin + <b>role</b> (did your starters get more or less work than ESPN expected, vs. theirs) + <b>luck</b> (what they did with that work) + K and D/ST vs. their projections. ${esc(m.summary)}</p>
    <div class="card scroll"><table>
      <tr><th>Week</th><th>Opponent</th><th>What happened</th><th class="num" title="Your starters' projection minus theirs">Projected</th><th class="num" title="Usage vs ESPN, yours minus theirs">Role</th><th class="num" title="What they did with the usage, yours minus theirs">Luck</th><th class="num">K & D/ST</th><th class="num">Final</th></tr>
      ${m.weeks.map(w => `<tr class="clickable" onclick="S.week=${w.week};S.tab='review';S.revOpen=null;syncControls();route()"><td>${w.week}</td><td>${esc(w.opponent)}</td><td class="small">${esc(w.verdict)}</td>
        <td class="num">${sgn(w.proj_margin)}</td>${luckTd(w.role)}${luckTd(w.luck)}${luckTd(w.kdst)}<td class="num"><b>${sgn(w.margin)}</b></td></tr>`).join("")}
      <tr><td colspan="3"><b>Season</b></td>${["proj_margin", "role", "luck", "kdst", "margin"].map(k => `<td class="num"><b>${sgn(m.totals[k])}</b></td>`).join("")}</tr>
    </table></div>
    <p class="small muted">Click a week to open its Weekly Review.</p>`;
}
// ------------------------------------------------------------------ post-week review
// actual = ESPN projection + role (expected pts from the usage he got - projection) + luck (actual - expected pts)
const luckTd = d => d == null ? `<td class="num muted">–</td>` : `<td class="num" style="${tint(d, 6)}">${sgn(d)}</td>`;
const share = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
const n0 = x => x == null ? "–" : Math.round(x).toString();
function usageText(u) {
  if (!u) return "";
  const bits = [];
  if (u.pass_att) bits.push(`${u.pass_att} pass att`);
  if (u.targets) bits.push(`${u.targets} of ${u.team_targets} targets`);
  if (u.carries) bits.push(`${u.carries} of ${u.team_carries} carries`);
  if (u.i10) bits.push(`${u.i10} inside-10`);
  return bits.join(" · ");
}
function waterfall(a, b) {
  const steps = [["Projected margin", a.proj - b.proj, true], ["Role (usage vs ESPN)", a.role - b.role], ["Luck (what they did with it)", a.luck - b.luck],
                 ["K & D/ST vs ESPN", a.kdst - b.kdst], ["Final margin", a.actual - b.actual, true]];
  let run = 0; const segs = steps.map(([lab, v, total]) => { const s = total ? {lab, from: 0, to: v, v, total} : {lab, from: run, to: run + v, v}; run = total ? v : run + v; return s; });
  const lo = Math.min(0, ...segs.flatMap(s => [s.from, s.to])), hi = Math.max(0, ...segs.flatMap(s => [s.from, s.to]));
  const W = 560, L = 190, R = 60, rowH = 26, x = v => L + (W - L - R) * (v - lo) / ((hi - lo) || 1);
  const rows = segs.map((s, i) => { const y = 6 + i * rowH, x0 = x(Math.min(s.from, s.to)), x1 = x(Math.max(s.from, s.to));
    const col = s.total ? "var(--text-secondary)" : s.v >= 0 ? "var(--win)" : "var(--loss)";
    return `<text x="${L - 8}" y="${y + 14}" font-size="12" text-anchor="end" fill="var(--text-secondary)">${s.lab}</text>
      <rect x="${x0}" y="${y + 3}" width="${Math.max(1.5, x1 - x0)}" height="${rowH - 10}" rx="2" fill="${col}" opacity="${s.total ? .5 : .85}"/>
      <text x="${x1 + 5}" y="${y + 14}" font-size="12" fill="var(--text-primary)" font-weight="${s.total ? 600 : 400}">${sgn(s.v)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${segs.length * rowH + 10}" width="100%" style="max-width:${W}px" role="img" aria-label="Margin breakdown">
    <line x1="${x(0)}" x2="${x(0)}" y1="2" y2="${segs.length * rowH + 6}" stroke="var(--border)"/>${rows}</svg>`;
}

// One player's week in three lines: the work he got (vs his usual), what that work is worth vs ESPN (+ likely why), what he did with it.
function playerStory(p) {
  const u = p.usage;
  if (!u) return `<div class="srow"><b>Work</b><span>No targets, carries or passes recorded (inactive, hurt early, or no touches).</span></div>`;
  const shareBit = (n, tot, lab, us) => {
    const sh = n / tot, d = us == null ? 0 : sh - us;
    const arrow = Math.abs(d) >= 0.08 ? (d > 0 ? ` <b class="up">↑</b>` : ` <b class="down">↓</b>`) : "";
    return `${n} of ${tot} ${lab} <span class="muted">· ${share(n, tot)}${us != null ? ` (usual ${Math.round(100 * us)}%)` : ""}</span>${arrow}`;
  };
  const work = [];
  if (u.pass_att) work.push(`${u.pass_att} passes`);
  if (u.team_carries && (u.carries || u.usual_car_share > 0.05)) work.push(shareBit(u.carries || 0, u.team_carries, "carries", u.usual_car_share));
  if (u.team_targets && p.pos !== "QB") work.push(shareBit(u.targets || 0, u.team_targets, "targets", u.usual_tgt_share));
  if (u.team_i10 && (u.i10 || u.usual_i10_share > 0.1)) work.push(shareBit(u.i10 || 0, u.team_i10, "inside-10", u.usual_i10_share));
  const fmt = (st, v) => st === "yds" ? n0(v) : v.toFixed(1).replace(/\.0$/, "");
  const did = p.parts.filter(x => x.xfp >= 1 || x.fp >= 1).flatMap(x => x.stats.filter(t => t.stat !== "rec" && (t.actual || t.exp >= 0.3))
    .map(t => `${fmt(t.stat, t.actual)} ${x.part === "pass" ? "pass" : x.part === "rush" ? "rush" : "rec"} ${t.stat} <span class="muted">(${fmt(t.stat, t.exp)} exp)</span>`));
  const why = (p.why || []).length ? `<div class="why">${p.why.map(w => `<div>${esc(w)}</div>`).join("")}</div>` : "";
  return `<div class="srow"><b>Work</b><span>${work.join("<br>")}</span></div>
    <div class="srow"><b>Role <span class="pill" style="${tint(p.role, 6)}">${sgn(p.role)}</span></b><span>Worth <b>${pts(p.xfp)}</b> vs ESPN's ${pts(p.proj)}${why}</span></div>
    <div class="srow"><b>Luck <span class="pill" style="${tint(p.luck, 6)}">${sgn(p.luck)}</span></b><span>Scored <b>${pts(p.actual)}</b>${did.length ? ` · ${did.join(" · ")}` : ""}</span></div>`;
}
function partsTable(p) {
  if (!p.parts.length) return "";
  const f = (s, v) => s === "yds" ? n0(v) : v.toFixed(1);
  return `<table class="small" style="margin-top:6px"><tr><th>What</th><th class="num" title="ESPN's projected stat line">ESPN projected</th><th class="num" title="What his actual touches usually produce">His touches usually produce</th><th class="num">Actual</th></tr>
    ${p.parts.map(x => `<tr><td><b>${x.label}</b></td><td class="num"><b>${pts(x.espn)}</b> pts</td><td class="num"><b>${pts(x.xfp)}</b> pts</td><td class="num"><b>${pts(x.fp)}</b> pts</td></tr>
      ${x.stats.map(s => `<tr><td class="muted" style="padding-left:16px">${s.stat}</td><td class="num muted">${f(s.stat, s.espn)}</td><td class="num muted">${f(s.stat, s.exp)}</td><td class="num">${f(s.stat, s.actual)}</td></tr>`).join("")}`).join("")}
  </table><p class="small muted" style="margin:6px 0 0">Points use this league's scoring; fumbles aren't split out, so parts can differ slightly from the total. The gap between the first two columns is the role; between the last two, the luck.</p>`;
}
function reviewTable(rows, title, side) {
  const st = rows.filter(p => p.slot !== "BE" && p.slot !== "IR").sort((a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot));
  return `<div class="card scroll"><h3 style="margin-top:0">${esc(title)}</h3><table>
    <tr><th>Slot</th><th>Player</th><th class="num">ESPN</th><th class="num" title="Expected points from the usage he actually got">Usage worth</th><th class="num">Actual</th>
      <th class="num" title="Usage worth − ESPN">Role</th><th class="num" title="Actual − usage worth">Luck</th><th></th></tr>
    ${st.map(p => { const k = side + p.id, open = S.revOpen === k;
      return `<tr class="clickable ${open ? "hl" : ""}" data-rev="${k}"><td class="muted">${p.slot}</td><td><b>${esc(p.name)}</b> <span class="muted small">${esc(p.pos || "")} ${esc(p.team || "")}</span>
        <div class="small muted">${usageText(p.usage)}</div></td>
      <td class="num">${pts(p.proj)}</td><td class="num">${p.xfp == null ? `<span class="muted small">n/a</span>` : pts(p.xfp)}</td><td class="num"><b>${pts(p.actual)}</b></td>
      ${p.xfp == null ? `<td class="num muted" colspan="2" style="text-align:center;${tint(p.actual - p.proj, 6)}">${sgn(p.actual - p.proj)} vs ESPN</td>` : luckTd(p.role) + luckTd(p.luck)}
      <td class="muted">${p.xfp == null ? "" : open ? "▾" : "▸"}</td></tr>
      ${open && p.xfp != null ? `<tr class="hl"><td colspan="8" style="padding:4px 10px 14px"><div class="story">${playerStory(p)}</div>
        <div style="margin-top:10px">${partsTable(p)}</div></td></tr>` : ""}`; }).join("")}
  </table></div>`;
}
function leagueList(title, sub, xs, key) {
  return `<div class="card"><h3 style="margin-top:0">${title}</h3><p class="small muted" style="margin:-4px 0 6px">${sub}</p><table>
    <tr><th>Player</th><th class="num">ESPN</th><th class="num">Usage worth</th><th class="num">Actual</th><th class="num">${key === "luck" ? "Luck" : "Role"}</th></tr>
    ${xs.map(p => `<tr><td>${esc(p.name)} <span class="muted small">${p.pos} ${esc(p.team || "")}</span>
        ${key === "role" && p.why && p.why.length ? `<div class="small secondary" style="margin-top:2px">${p.why.map(esc).join("<br>")}</div>` : ""}</td><td class="num">${pts(p.proj)}</td><td class="num">${pts(p.xfp)}</td>
      <td class="num">${pts(p.actual)}</td>${luckTd(p[key])}</tr>`).join("")}</table></div>`;
}
function renderReview(d) {
  S.reviewData = d;
  const r = d.review, a = r.totals.me, b = r.totals.opp;
  setHeader(`Week ${r.week} · ${esc(r.me.name)} vs ${esc(r.opp.name)} · final`);

      “Usage worth” is nflverse's expected fantasy points for each target, carry and pass based on where it happened, rescored for this league. K and D/ST have no usage model. Click a player for the full breakdown.
      <b>Information only:</b> on 2019–2025, neither part predicted the next week better than ESPN.</p>
    <div class="grid2">
      <div class="card"><h3 style="margin-top:0">${esc(r.me.name)} ${pts(a.actual)} – ${pts(b.actual)} ${esc(r.opp.name)} · ${won ? "won" : "lost"}</h3>
        <p style="margin:0 0 8px">${esc(r.verdict)}</p>${waterfall(a, b)}
        <p class="small muted" style="margin:6px 0 0">Positive = in ${esc(r.me.name)}'s favour. Each bar is your starters' total minus theirs.</p></div>
      <div class="card"><h3 style="margin-top:0">Bench calls</h3>${r.bench_calls.length ? r.bench_calls.map(c => `<div class="factor"><div class="hd"><span>${esc(c.bench.name)} (bench) ${pts(c.bench.actual)} vs ${esc(c.starter.name)} ${pts(c.starter.actual)}</span><span>${sgn(-c.gain)}</span></div>
          <p class="small secondary">ESPN ${pts(c.bench.proj)} vs ${pts(c.starter.proj)} · usage worth ${pts(c.bench.xfp)} vs ${pts(c.starter.xfp)}</p><p class="small">${esc(c.why)}</p></div>`).join("")
        : `<p class="small muted">No bench player beat a starter he could have replaced by 3+ points.</p>`}</div>
    </div>
    <div class="grid2" style="margin-top:10px">${reviewTable(r.players.me, r.me.name, "me")}${reviewTable(r.players.opp, r.opp.name, "opp")}</div>
    <h2>Around the league, Week ${r.week}</h2>
    <div class="grid2">
      ${leagueList("Unlucky with a big role", "Usage worth 10+, scored far less", r.league.unlucky, "luck")}
      ${leagueList("Lucky with a big role", "Usage worth 10+, scored far more", r.league.lucky, "luck")}
      ${leagueList("Used more than ESPN expected", "Role above the projection, with likely reasons from snaps, injuries, the betting line vs the final score, team volume and weather", r.league.role_up, "role")}
      ${leagueList("Used less than ESPN expected", "Projected 8+, role below the projection, with likely reasons", r.league.role_down, "role")}
    </div>`;
  document.querySelectorAll("[data-rev]").forEach(tr => tr.onclick = () => { S.revOpen = S.revOpen === tr.dataset.rev ? null : tr.dataset.rev; renderReview(S.reviewData); });
}
// ------------------------------------------------------------------ trade analyzer
// Each completed trade: who moved, what each side scored since, and your highest-projection lineup
// with vs without the trade (scored on actual results), so lineup choices don't muddy the comparison.
function tradeSide(title, ps, mine, nowWeek) {
  if (!ps.length) return "";
  return `<div><div class="tside">${title}</div><table class="small">
    <tr><th>Player</th><th class="num" title="${mine ? "Points while on your roster" : "Points over the same weeks, wherever he was"}">Pts</th><th class="num" title="${mine ? "Points in your starting lineup (weeks started)" : "Points as a starter for his new team (weeks started)"}">As starter</th>
      ${nowWeek ? `<th class="num" title="ESPN projection for week ${nowWeek}">W${nowWeek} ESPN</th>` : ""}</tr>
    ${ps.map(p => `<tr><td><b>${esc(p.name)}</b> <span class="muted">${esc(p.pos || "")}</span>${!mine && p.now_with ? `<div class="muted">now: ${esc(p.now_with)}</div>` : ""}
      ${p.weeks.some(w => w.no_game) ? `<div class="muted">didn't play in W${p.weeks.filter(w => w.no_game).map(w => w.week).join(", W")}</div>` : ""}</td>
      <td class="num"><b>${pts(p.total)}</b></td><td class="num">${pts(p.started_pts)} <span class="muted">(${p.started_weeks})</span></td>
      ${nowWeek ? `<td class="num">${p.proj_now ? pts(p.proj_now) : "–"}</td>` : ""}</tr>`).join("")}
  </table></div>`;
}
function tradeCard(t, nowWeek) {
  const span = t.in_effect_from == null ? "not in effect for any finished week yet"
    : t.in_effect_from === t.in_effect_to ? `Week ${t.in_effect_from}` : `Weeks ${t.in_effect_from}–${t.in_effect_to}`;
  const n = t.net_lineup, flips = t.weekly.filter(w => w.won_with !== w.won_undone);
  const verdict = t.in_effect_from == null ? "No finished weeks yet."
    : `${Math.abs(n) < 2 ? "About even for your lineup" : n > 0 ? `Your lineup scored <b>${pts(n)} more</b>` : `Your lineup scored <b>${pts(-n)} less</b>`} with the trade (${span})`
      + (flips.length ? `, and it <b>${flips.map(w => `${w.won_with ? "won" : "lost"} you Week ${w.week}`).join(", ")}</b>.` : ", without changing any result.");
  return `<div class="card tradecard"><div class="thead"><h3 style="margin:0">Week ${t.week} · with ${esc(t.partner)}</h3>
      <span class="pill" style="${tint(n, 15)}">${Math.abs(n) < 0.05 ? "±0" : sgn(n)} lineup pts</span></div>
    <p style="margin:6px 0 10px">${verdict}${t.ended_by_trade_week ? ` <span class="muted">Window ends when you traded ${t.got.length > 1 ? "them" : "him"} on in Week ${t.ended_by_trade_week}.</span>` : ""}</p>
    <div class="grid2" style="margin-top:0">${tradeSide("You got", t.got, true, nowWeek)}${tradeSide("You gave", t.gave, false, nowWeek)}</div>
    ${t.dropped.length ? `<div style="margin-top:8px">${tradeSide("Also dropped to make room", t.dropped, false, nowWeek)}</div>` : ""}
    ${t.weekly.length ? `<details style="margin-top:10px"><summary class="small secondary">Week by week</summary><table class="small" style="margin-top:6px">
      <tr><th>Week</th><th>Opponent</th><th class="num" title="Your highest-projection lineup, scored on actual results">With trade</th><th class="num" title="Same, with the trade undone">Undone</th><th class="num">Diff</th><th class="num">Opp</th><th>Result</th><th>Who started</th></tr>
      ${t.weekly.map(w => `<tr><td>${w.week}</td><td>${esc(w.opponent)}</td><td class="num">${pts(w.with_trade)}</td><td class="num">${pts(w.undone)}</td>${luckTd(w.diff)}<td class="num">${pts(w.opp_points)}</td>
        <td>${w.won_with === w.won_undone ? `<span class="muted">${w.won_with ? "W" : "L"} either way</span>` : `<b>${w.won_with ? "W" : "L"}</b> (undone: ${w.won_undone ? "W" : "L"})`}</td>
        <td class="muted">${[...w.got_started.map(x => esc(x)), ...w.gave_would_start.map(x => `<s>${esc(x)}</s>`)].join(" · ") || "neither side"}</td></tr>`).join("")}
    </table><p class="small muted" style="margin:4px 0 0">Who started: incoming players in your best lineup; <s>struck</s> = outgoing players who'd have started had you kept them.</p></details>` : ""}
  </div>`;
}
// Every league trade, both sides: each team's best lineup with vs without its part of the trade.
function leagueTrades(rows, me) {
  if (!rows.length) return "";
  const side = x => `<td><b>${esc(x.team)}</b><div class="small secondary">got ${x.got.map(esc).join(", ") || "–"}</div></td>
    ${x.weeks ? luckTd(x.net_lineup) : `<td class="num muted">–</td>`}
    <td class="small">${x.wins_gained || x.wins_lost ? `${x.wins_gained ? `<b>+${x.wins_gained} W</b>` : ""}${x.wins_gained && x.wins_lost ? " · " : ""}${x.wins_lost ? `<b>−${x.wins_lost} W</b>` : ""}` : `<span class="muted">${x.weeks ? "no change" : "not yet"}</span>`}</td>`;
  const verdict = t => { const ss = t.sides.filter(x => x.weeks).sort((a, b) => b.net_lineup - a.net_lineup);
    if (ss.length < 2) return `<span class="muted">no finished weeks yet</span>`;
    const gap = ss[0].net_lineup - ss[ss.length - 1].net_lineup;
    return gap < 5 ? "About even so far" : `<b>${esc(ss[0].team)}</b> ahead so far`; };
  const width = Math.max(...rows.map(t => t.sides.length));
  return `<h2>Every trade in the league</h2>
    <p class="intro">Both sides of each trade, judged the same way: each team's highest-projection lineup with vs. without its part of the trade, scored on actual results, over the weeks since. “W” = results the trade flipped for that team. Players dropped to make room are only known for your own trades.</p>
    <div class="card scroll"><table>
      <tr><th>Week</th>${Array.from({length: width}, (_, i) => `<th>Team ${String.fromCharCode(65 + i)}</th><th class="num">Lineup pts</th><th>Results</th>`).join("")}<th>So far</th></tr>
      ${rows.map(t => `<tr class="${t.involves_me ? "hl" : ""}"><td>${t.week}</td>${t.sides.map(side).join("")}${"<td></td><td></td><td></td>".repeat(width - t.sides.length)}<td class="small">${verdict(t)}</td></tr>`).join("")}
    </table></div>
    <p class="small muted">Highlighted rows involve ${esc(me)}. A trade's window ends when a team trades its incoming players on.</p>`;
}
// The shareable rankings page, as it will look to others (no league details), in a frame sized to its content
function renderRankings() {
  setHeader(`Every player in this week's pool · the same page as the shareable link`);
  $("#main").innerHTML = `
    <div class="rk-bar"><p class="intro" style="margin:0">League-free: no rosters, team names or IDs. <b>Save shareable copy</b> writes it to
      <code>data/share/</code>; to update the published link, ask Claude to republish that file.</p>
      <span class="spacer"></span><span id="rk-msg" class="small muted"></span><button id="rk-save">Save shareable copy</button></div>
    <div class="loading" id="rk-load">Building rankings for every player…</div>
    <iframe id="rk" src="/rankings" title="Player rankings" style="width:100%;border:0;display:block;min-height:400px;visibility:hidden"></iframe>`;
  const f = $("#rk");
  f.onload = () => {
    $("#rk-load").remove(); f.style.visibility = "";
    const body = f.contentDocument.body, fit = () => { f.style.height = body.scrollHeight + "px"; };
    new ResizeObserver(fit).observe(body); fit();
  };
  $("#rk-save").onclick = async () => { const b = $("#rk-save"); b.disabled = true;
    try { const r = await getJSON("/api/rankings/save", {method: "POST"}); $("#rk-msg").textContent = `Saved ${r.name}`; }
    catch (e) { $("#rk-msg").textContent = e.message; } finally { b.disabled = false; } };
}

function renderTrades(d) {
  const ts = d.trades, tot = d.totals;
  setHeader(`${esc(d.team.name)} · ${ts.length} of the league's ${d.league.length} trade${d.league.length === 1 ? "" : "s"}`);
  const got = ts.reduce((s, t) => s + t.got_points, 0), gave = ts.reduce((s, t) => s + t.gave_points, 0);
  $("#main").innerHTML = `
    <p class="intro">Every completed trade, from the league's activity feed. <b>Lineup pts</b> compares your highest-projection lineup each week with the trade and with it undone (incoming players out, outgoing and dropped players back), both scored on what actually happened. That isolates the trade from your start/sit calls. It assumes you'd have kept the outgoing players and made every other move the same; a trade's window ends when you trade its incoming players on, and the later trade takes over. Finished weeks only (W${d.weeks[0]}–W${d.weeks[d.weeks.length - 1]}).</p>
    ${ts.length ? `<div class="tiles">
      <div class="card tile"><div class="label">Trades</div><div class="value">${ts.length}</div></div>
      <div class="card tile"><div class="label">Lineup points from trades</div><div class="value">${sgn(tot.net_lineup)}</div><div class="sub">best lineup with vs without each trade</div></div>
      <div class="card tile"><div class="label">Results changed</div><div class="value">${tot.wins_gained} won · ${tot.wins_lost} lost</div><div class="sub">weeks the trade flipped the result</div></div>
      <div class="card tile"><div class="label">Raw points: got vs gave</div><div class="value">${pts(got, 0)} / ${pts(gave, 0)}</div><div class="sub">wherever the players were, same weeks</div></div>
    </div>
    <h2>Your trades, newest first</h2>
    ${ts.slice().reverse().map(t => tradeCard(t, d.now_week)).join("")}` : `<div class="card"><p class="muted" style="margin:0">No completed trades for this team.</p></div>`}
    ${leagueTrades(d.league, d.team.name)}`;
}
init().catch(e => $("#main").innerHTML = `<div class="loading err">${esc(e.message)}</div>`);
</script>
</body>
</html>
