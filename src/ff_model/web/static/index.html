<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start/Sit</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --me: #2a78d6; --me-soft: #cde2fb; --opp: #eb6834; --opp-soft: #fbdccd;
  --win: #2a78d6; --loss: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --chip: #eeede9;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
    --me: #3987e5; --me-soft: #1c3a5f; --opp: #d95926; --opp-soft: #4a2a1c;
    --win: #3987e5; --loss: #e66767; --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh; padding: 20px 24px 48px; }
h1 { font-size: 20px; margin: 0; } h2 { font-size: 16px; margin: 28px 0 10px; }
.muted { color: var(--text-muted); } .secondary { color: var(--text-secondary); }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); }
button { cursor: pointer; } button:disabled { opacity: .5; cursor: wait; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--chip); color: var(--text-secondary); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
.chip.status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
  background: var(--dot); vertical-align: 0; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.tile .label { color: var(--text-secondary); font-size: 12px; } .tile .value { font-size: 30px; font-weight: 650; }
.tile .sub { color: var(--text-muted); font-size: 12px; }
.decision { margin-top: 12px; display: flex; gap: 14px; align-items: flex-start; }
.decision .tag { font-weight: 650; padding: 2px 10px; border-radius: 6px; background: var(--chip); white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-secondary); padding: 6px 8px;
  border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr.bench td { color: var(--text-secondary); } tr.sep td { border-bottom: 1px solid var(--border); padding: 0; }
tr.rec td:first-child { box-shadow: inset 3px 0 0 var(--me); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pname { font-weight: 600; white-space: nowrap; } .pmeta { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
td.ctx { min-width: 220px; max-width: 300px; } td.links { max-width: 230px; }
td.links .chip { white-space: normal; } td.swap { min-width: 84px; padding-left: 14px; }
.small { font-size: 12px; }
.eff { font-size: 12px; white-space: nowrap; } .eff b { font-weight: 600; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); align-items: center; flex-wrap: wrap; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
  display: none; z-index: 10; max-width: 300px; }
.loading { padding: 60px; text-align: center; color: var(--text-secondary); }
.scroll { overflow-x: auto; }
details summary { cursor: pointer; color: var(--text-secondary); }
ul.notes { margin: 6px 0 0 18px; padding: 0; color: var(--text-secondary); } ul.notes li { margin: 3px 0; }
.err { color: var(--critical); }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <div class="bar">
    <h1 id="title">Start/Sit</h1>
    <span class="spacer"></span>
    <label class="secondary small">Snapshot <select id="snap"></select></label>
    <button id="fresh" title="Fetch ESPN projections, injuries and weather now (no odds credits)">Take fresh snapshot</button>
  </div>
  <div id="fresh-chips" class="chips" style="margin-top:8px"></div>
  <div id="main"><div class="loading">Running 20,000 simulations of your matchup…</div></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $ = (s) => document.querySelector(s);
const pct = (x, d = 0) => x == null ? "–" : (100 * x).toFixed(d) + "%";
const pts = (x, d = 1) => x == null ? "–" : Number(x).toFixed(d);
const sgn = (x, d = 1) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}) : "–";
const ago = (iso) => { if (!iso) return "–"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.style.display = "none"; }

async function loadSnapshots(selected) {
  const snaps = await (await fetch("/api/snapshots")).json();
  $("#snap").innerHTML = snaps.map(s => `<option value="${s.id}" ${s.id == selected ? "selected" : ""}>#${s.id} · W${s.week} · ${esc(s.slot_key ? s.slot_key.split("-").pop() : "manual")} · ${when(s.started_at)}</option>`).join("");
}

async function load(sid) {
  $("#main").innerHTML = `<div class="loading">Running 20,000 simulations of your matchup…</div>`;
  const r = await (await fetch("/api/report" + (sid ? `?snapshot=${sid}` : ""))).json();
  if (r.error) { $("#main").innerHTML = `<div class="loading err">${esc(r.error)}</div>`; return; }
  await loadSnapshots(r.snapshot_id);
  render(r);
}

$("#snap").addEventListener("change", e => load(e.target.value));
$("#fresh").addEventListener("click", async () => {
  const b = $("#fresh"); b.disabled = true; b.textContent = "Taking snapshot…";
  try { const r = await (await fetch("/api/snapshot", {method: "POST"})).json();
        if (r.error) alert(r.error); else await load(r.snapshot_id); }
  finally { b.disabled = false; b.textContent = "Take fresh snapshot"; }
});

function statusChips(p) {
  const c = [];
  if (p.locked) c.push(`<span class="chip">Locked · ${pts(p.actual)} pts</span>`);
  if (p.status === "Out") c.push(`<span class="chip status" style="--dot:var(--critical)">Out</span>`);
  else if (p.status === "Doubtful") c.push(`<span class="chip status" style="--dot:var(--serious)">Doubtful</span>`);
  else if (p.status === "Questionable") c.push(`<span class="chip status" style="--dot:var(--warning)">Questionable</span>`);
  if (p.practice && p.status && p.status !== "none") {
    const t = /Did Not/.test(p.practice) ? "Missed practice" : /Limited/.test(p.practice) ? "Limited practice" : "Full practice";
    c.push(`<span class="chip">${t}${p.injury ? " · " + esc(p.injury) : ""}</span>`);
  }
  if (p.games_back === 1 || p.games_back === 2) c.push(`<span class="chip">${p.games_back === 1 ? "1st" : "2nd"} game back</span>`);
  if (p.unavailable && !p.locked && p.status !== "Out") c.push(`<span class="chip">Unavailable</span>`);
  return c.join(" ");
}

function contextChips(p) {
  const c = [];
  if (p.roof === "outdoors" && p.wind != null) c.push(`${Math.round(p.wind)} mph${p.gust ? ` (gusts ${Math.round(p.gust)})` : ""}, ${Math.round(p.temp)}°F${p.precip_prob ? `, ${Math.round(p.precip_prob)}% rain` : ""}`);
  else if (p.roof) c.push(p.roof === "dome" ? "Dome" : "Roof closed");
  if (p.spread != null) c.push(p.spread >= 0 ? `Favored by ${pts(p.spread)}` : `Underdog by ${pts(-p.spread)}`);
  if (p.total != null) c.push(`O/U ${pts(p.total)}`);
  if (p.pos === "D/ST" && p.opp_ol_out) c.push(`Opp missing ${p.opp_ol_out} OL starter${p.opp_ol_out > 1 ? "s" : ""}`);
  if (p.pos === "QB" && p.opp_db_out) c.push(`Opp missing ${p.opp_db_out} DB starter${p.opp_db_out > 1 ? "s" : ""}`);
  if ((p.pos === "QB" || p.pos === "RB") && p.ol_out) c.push(`Own OL missing ${p.ol_out}`);
  return c.map(x => `<span class="chip">${esc(x)}</span>`).join(" ");
}

function effectText(p) {
  const names = {weather: "weather", spread: "spread", injury: "injury", lines: "OL/DB"};
  const parts = Object.entries(p.effects || {}).filter(([, v]) => Math.abs(v) >= 0.1)
    .map(([k, v]) => `<b>${sgn(v)}</b> ${names[k]}`);
  return parts.length ? `<span class="eff">${parts.join(" · ")}</span>` : `<span class="muted small">none</span>`;
}

// one shared scale per table so ranges are comparable down the column
function scaleFor(rows) {
  const hi = Math.max(25, ...rows.map(p => p.locked ? p.actual || 0 : p.quantiles.p90));
  const lo = Math.min(0, ...rows.map(p => p.quantiles.p10));
  return {lo: Math.floor(lo / 5) * 5, hi: Math.ceil(hi / 5) * 5};
}
function rangeSvg(p, sc, color, soft) {
  const W = 190, H = 24, x = v => 6 + (W - 16) * (v - sc.lo) / (sc.hi - sc.lo);
  const grid = []; for (let t = Math.ceil(sc.lo / 10) * 10; t <= sc.hi; t += 10)
    grid.push(`<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H}" stroke="var(--grid)" stroke-width="1"/>`);
  if (p.locked) {
    return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(p.name)} locked at ${pts(p.actual)} points">${grid.join("")}
      <circle cx="${x(p.actual || 0)}" cy="${H / 2}" r="5" fill="${color}" stroke="var(--surface-1)" stroke-width="2"/></svg>`;
  }
  const q = p.quantiles;
  return `<svg width="${W}" height="${H}" class="rng" data-id="${p.id}" role="img"
      aria-label="${esc(p.name)}: 80% range ${pts(q.p10)} to ${pts(q.p90)}, median ${pts(q.p50)}, ESPN ${pts(p.proj)}">${grid.join("")}
    <line x1="${x(q.p10)}" x2="${x(q.p90)}" y1="${H / 2}" y2="${H / 2}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <rect x="${x(q.p25)}" y="${H / 2 - 6}" width="${Math.max(2, x(q.p75) - x(q.p25))}" height="12" rx="4" fill="${soft}" stroke="${color}" stroke-width="1.5"/>
    <line x1="${x(q.p50)}" x2="${x(q.p50)}" y1="${H / 2 - 7}" y2="${H / 2 + 7}" stroke="${color}" stroke-width="2.5"/>
    <path d="M ${x(p.proj)} ${H / 2 - 6} l 5 6 l -5 6 l -5 -6 z" fill="var(--text-primary)" stroke="var(--surface-1)" stroke-width="1.5"/>
  </svg>`;
}
function axisSvg(sc) {
  const W = 190, x = v => 6 + (W - 16) * (v - sc.lo) / (sc.hi - sc.lo), t = [];
  for (let v = Math.ceil(sc.lo / 10) * 10; v <= sc.hi; v += 10) t.push(`<text x="${x(v)}" y="10" text-anchor="middle" font-size="10" fill="var(--text-muted)">${v}</text>`);
  return `<svg width="${W}" height="12">${t.join("")}</svg>`;
}

function playerRow(p, sc, side, cls = "") {
  const color = side === "me" ? "var(--me)" : "var(--opp)", soft = side === "me" ? "var(--me-soft)" : "var(--opp-soft)";
  const ch = p.chance || {};
  let swap = "";
  if (side === "me" && p.pwin_if_started != null) {
    if (p.recommended) swap = p.pwin_if_benched != null ? `${pct(p.pwin_if_benched, 1)}<div class="muted">if benched</div>` : "";
    else swap = `${pct(p.pwin_if_started, 1)}<div class="muted">if started</div>`;
  }
  const links = side === "me" && !p.unavailable ? [
    ...(p.stacks || []).map(s => `<span class="chip" title="Same team as your starter: outcomes move together">Stack · ${esc(s)}</span>`),
    ...(p.vs_opponent || []).map(s => `<span class="chip" title="Same game as your opponent's starter">Same game · ${esc(s)}</span>`)
  ].join(" ") : "";
  return `<tr class="${cls}">
    <td class="small">${esc(side === "me" && p.recommended ? p.rec_slot : p.slot)}</td>
    <td><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.pos)} · ${esc(p.team || "")}${p.opp ? " vs " + esc(p.opp) : " · bye"} · ${p.locked ? "played" : when(p.kickoff)}</div>
        <div class="chips" style="margin-top:3px">${statusChips(p)}</div></td>
    <td class="num">${pts(p.proj)}</td>
    <td class="num">${p.locked || p.unavailable ? "–" : pts(p.quantiles.p50)}</td>
    <td>${p.unavailable ? "" : rangeSvg(p, sc, color, soft)}</td>
    <td class="num">${p.locked || p.unavailable ? "–" : pct(ch.beat_proj)}</td>
    <td class="num">${p.locked || p.unavailable ? "–" : pct(ch.dud)}</td>
    <td class="num">${p.locked || p.unavailable ? "–" : pct(ch.twenty)}</td>
    <td class="ctx">${p.locked || p.unavailable ? "" : effectText(p) + `<div class="chips" style="margin-top:3px">${contextChips(p)}</div>`}</td>
    ${side === "me" ? `<td class="small links"><div class="chips">${links}</div></td><td class="num small swap">${swap}</td>` : ""}
  </tr>`;
}

function table(rows, side) {
  const sc = scaleFor(rows.filter(p => !p.unavailable));
  const head = `<tr><th>Slot</th><th>Player</th><th class="num">ESPN</th><th class="num">Model median</th>
    <th>Model range ${axisSvg(sc)}</th><th class="num">Beats ESPN</th><th class="num">Under 5</th><th class="num">20+</th>
    <th>What moved the median · context</th>${side === "me" ? "<th>Stack / same game</th><th class=\"num\">P(win)</th>" : ""}</tr>`;
  const order = {QB: 0, RB: 1, WR: 2, TE: 3, FLEX: 4, "D/ST": 5, K: 6, BE: 7, IR: 8};
  let start, bench;
  if (side === "me") {
    start = rows.filter(p => p.recommended || (p.locked && !["BE", "IR"].includes(p.slot)));
    bench = rows.filter(p => !start.includes(p));
  } else {
    start = rows.filter(p => p.starting); bench = rows.filter(p => !p.starting);
  }
  const k = p => order[side === "me" && p.recommended ? p.rec_slot : p.slot] ?? 9;
  start.sort((a, b) => k(a) - k(b)); bench.sort((a, b) => (b.proj || 0) - (a.proj || 0));
  return `<div class="scroll"><table>${head}
    ${start.map(p => playerRow(p, sc, side, side === "me" && !p.in_max_proj && !p.locked ? "rec" : "")).join("")}
    <tr class="sep"><td colspan="11"></td></tr>
    ${bench.map(p => playerRow(p, sc, side, "bench")).join("")}</table></div>`;
}

function marginChart(r) {
  const {edges, counts, n} = r.margin_hist, W = 640, H = 170, padL = 8, padB = 22;
  const x = v => padL + (W - 2 * padL) * (v - edges[0]) / (edges[edges.length - 1] - edges[0]);
  const ymax = Math.max(...counts), y = c => (H - padB) * (1 - c / ymax);
  const bars = counts.map((c, i) => {
    const a = edges[i], b = edges[i + 1], win = a >= 0;
    return `<rect class="mbar" data-a="${a}" data-b="${b}" data-p="${c / n}" x="${x(a) + 1}" y="${y(c)}" width="${Math.max(1, x(b) - x(a) - 2)}"
      height="${(H - padB) - y(c)}" rx="2" fill="${win ? "var(--win)" : "var(--loss)"}"/>`;
  }).join("");
  const ticks = []; for (let v = Math.ceil(edges[0] / 20) * 20; x(v) <= W - 24; v += 20)
    ticks.push(`<text x="${x(v)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${v > 0 ? "+" : ""}${v}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribution of your margin of victory; ${pct(r.p_win)} of simulations are wins">
    <line x1="${padL}" x2="${W - padL}" y1="${H - padB}" y2="${H - padB}" stroke="var(--border)"/>
    ${bars}
    <line x1="${x(0)}" x2="${x(0)}" y1="0" y2="${H - padB}" stroke="var(--text-secondary)" stroke-dasharray="3 3"/>
    <text x="${x(0) + 6}" y="12" font-size="11" fill="var(--text-secondary)">you win →</text>
    <text x="${x(0) - 6}" y="12" font-size="11" text-anchor="end" fill="var(--text-secondary)">← you lose</text>
    ${ticks.join("")}</svg>`;
}

function render(r) {
  $("#title").textContent = `Start/Sit · Week ${r.week}`;
  const f = r.freshness;
  $("#fresh-chips").innerHTML = [["Snapshot", f.snapshot], ["Odds", f.odds], ["Weather", f.weather], ["Injury report", f.injuries]]
    .map(([k, v]) => `<span class="chip">${k}: ${v ? when(v) + " · " + ago(v) : "none"}</span>`).join("");
  const gain = r.p_win - r.p_win_max_proj;
  const changed = r.changes.start.length > 0;
  const allPlayers = [...r.players.me, ...r.players.opp];
  $("#main").innerHTML = `
    <div class="tiles">
      <div class="card tile"><div class="label">Win probability, recommended lineup</div><div class="value">${pct(r.p_win)}</div>
        <div class="sub">${esc(r.me.name)} vs ${esc(r.opponent.name)}</div></div>
      <div class="card tile"><div class="label">With the highest-projection lineup</div><div class="value">${pct(r.p_win_max_proj)}</div>
        <div class="sub">${changed ? `recommended is ${sgn(100 * gain)} pts better` : "same lineup"}</div></div>
      <div class="card tile"><div class="label">ESPN's win probability</div><div class="value">${pct(r.espn_win_prob)}</div>
        <div class="sub">from the same snapshot</div></div>
      <div class="card tile"><div class="label">Expected score</div><div class="value">${pts(r.my_mean, 0)} – ${pts(r.opp_mean, 0)}</div>
        <div class="sub">you ${pts(r.my_range[0], 0)}–${pts(r.my_range[2], 0)} · them ${pts(r.opp_range[0], 0)}–${pts(r.opp_range[2], 0)} (80% ranges)</div></div>
    </div>
    <div class="card decision" style="margin-top:12px">
      <span class="tag">${changed ? "Change" : "No change"}</span>
      <div><div>${changed ? `Start <b>${r.changes.start.map(esc).join(", ")}</b>; bench <b>${r.changes.bench.map(esc).join(", ")}</b>.` : "Your highest-projection lineup is already the best bet."}
        ${r.close ? `<span class="chip" style="margin-left:6px">Close call: runner-up within 1 pt</span>` : `<span class="chip" style="margin-left:6px">Clear: runner-up more than 1 pt behind</span>`}</div>
        ${changed ? `<div class="secondary small" style="margin-top:4px">${esc(r.reason)}</div>` : ""}</div>
    </div>
    <div class="grid2">
      <div class="card"><div class="secondary small">Your margin of victory across ${r.draws.toLocaleString()} simulated weeks (recommended lineup)</div>${marginChart(r)}
        <div class="legend"><span><svg width="12" height="12"><rect width="12" height="12" rx="3" fill="var(--win)"/></svg> win</span>
          <span><svg width="12" height="12"><rect width="12" height="12" rx="3" fill="var(--loss)"/></svg> loss</span></div></div>
      <div class="card"><div class="secondary small" style="margin-bottom:6px">Runner-up lineups</div>
        <table><tr><th class="num">P(win)</th><th>Change from recommended</th><th class="num">Exp. pts</th></tr>
        ${r.alternatives.map(a => `<tr><td class="num">${pct(a.pwin, 1)}</td><td class="small">${a.in.length ? `${a.in.map(esc).join(", ")} for ${a.out.map(esc).join(", ")}` : "–"}</td><td class="num">${pts(a.mean)}</td></tr>`).join("")}
        </table></div>
    </div>
    <h2>${esc(r.me.name)}: recommended lineup, then bench</h2>
    <div class="legend" style="margin-bottom:6px">
      <span><svg width="44" height="14"><line x1="2" x2="42" y1="7" y2="7" stroke="var(--me)" stroke-width="2"/><rect x="12" y="2" width="18" height="10" rx="3" fill="var(--me-soft)" stroke="var(--me)" stroke-width="1.5"/><line x1="21" x2="21" y1="1" y2="13" stroke="var(--me)" stroke-width="2.5"/></svg>
        line: 10th–90th percentile (80% chance) · box: 25th–75th (50%) · tick: median</span>
      <span><svg width="12" height="14"><path d="M 6 1 l 5 6 l -5 6 l -5 -6 z" fill="var(--text-primary)"/></svg> ESPN projection</span>
      <span>Rows with a blue edge differ from the highest-projection lineup</span>
    </div>
    <div class="card">${table(r.players.me, "me")}</div>
    <h2>${esc(r.opponent.name)}: current lineup</h2>
    <div class="card">${table(r.players.opp, "opp")}</div>
    <h2>Games</h2>
    <div class="card scroll"><table><tr><th>Kickoff</th><th>Game</th><th>Roof</th><th>Forecast</th><th class="num">O/U</th><th>Line</th><th>Your starters</th><th>Their starters</th></tr>
      ${r.games.map(g => `<tr><td class="small">${when(g.kickoff)}</td><td>${esc(g.teams)}</td><td class="small">${esc(g.roof || "–")}</td>
        <td class="small">${g.roof === "outdoors" && g.wind != null ? `${Math.round(g.wind)} mph${g.gust ? ` (gusts ${Math.round(g.gust)})` : ""}, ${Math.round(g.temp)}°F, ${Math.round(g.precip_prob || 0)}% rain` : "–"}</td>
        <td class="num">${pts(g.total)}</td><td class="small">${esc(g.spread_note || "–")}</td>
        <td class="small">${g.mine.map(esc).join(", ")}</td><td class="small">${g.theirs.map(esc).join(", ")}</td></tr>`).join("")}</table></div>
    <h2>How to read this</h2>
    <div class="card small"><ul class="notes">
      <li><b>ESPN</b> is ESPN's projection (your league's scoring). The <b>model range</b> is where the player's score should land: 80% of the time between the line's ends, half the time inside the box. Back-tested on 2024–2026 games the model never saw.</li>
      <li><b>Beats ESPN / Under 5 / 20+</b> are the chances of beating ESPN's projection, a dud, and a big game, from the same 20,000 simulations.</li>
      <li><b>What moved the median</b> is how much each factor shifted the model's median vs. ignoring it: weather (dome, wind, cold), the spread, injury report and practice, and missing OL/DB starters.</li>
      <li><b>P(win)</b> simulates both lineups together, including how players move together (a QB and his receivers rise together; a D/ST falls when the QB it faces has a big day). "If started/benched" is the best P(win) available with that change.</li>
      <li>Players whose game has started are locked at their current points. Your opponent is assumed to keep their current lineup, with Out starters replaced from their bench.</li>
      <li>Known weak spots: kickers' upside is a little too narrow; matchup P(win) is slightly cautious at the extremes.</li>
    </ul></div>`;

  // hover tooltips: range bars and margin bars
  const byId = Object.fromEntries(allPlayers.map(p => [p.id, p]));
  document.querySelectorAll("svg.rng").forEach(el => {
    el.addEventListener("mousemove", e => { const p = byId[el.dataset.id], q = p.quantiles, c = p.chance || {};
      showTip(e, `<b>${esc(p.name)}</b><br>ESPN ${pts(p.proj)} · median ${pts(q.p50)}<br>10th ${pts(q.p10)} · 25th ${pts(q.p25)} · 75th ${pts(q.p75)} · 90th ${pts(q.p90)}<br>
        Beats ESPN ${pct(c.beat_proj)} · under 5 ${pct(c.dud)} · 20+ ${pct(c.twenty)}`); });
    el.addEventListener("mouseleave", hideTip);
  });
  document.querySelectorAll("rect.mbar").forEach(el => {
    el.addEventListener("mousemove", e => showTip(e, `Margin ${sgn(+el.dataset.a, 0)} to ${sgn(+el.dataset.b, 0)}: ${pct(+el.dataset.p, 1)} of simulations`));
    el.addEventListener("mouseleave", hideTip);
  });
}
load();
</script>
</body>
</html>
