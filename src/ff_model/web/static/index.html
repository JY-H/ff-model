<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start/Sit</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --me: #2a78d6; --me-soft: #cde2fb; --opp: #eb6834; --opp-soft: #fbdccd;
  --win: #2a78d6; --loss: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --chip: #eeede9; --hl: #fff5d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
    --me: #3987e5; --me-soft: #1c3a5f; --opp: #d95926; --opp-soft: #4a2a1c;
    --win: #3987e5; --loss: #e66767; --chip: #2a2a27; --hl: #3a3420;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh; padding: 16px 20px 48px; }
h1 { font-size: 20px; margin: 0; } h2 { font-size: 16px; margin: 24px 0 8px; } h3 { font-size: 14px; margin: 16px 0 6px; }
.muted { color: var(--text-muted); } .secondary { color: var(--text-secondary); } .small { font-size: 12px; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
select, button, input { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); }
button { cursor: pointer; } button:disabled { opacity: .5; cursor: wait; }
button.primary { background: var(--me); color: #fff; border-color: var(--me); }
.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--border); }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--text-secondary); }
.tabs button.on { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 600; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { background: var(--chip); color: var(--text-secondary); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.chip.status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--dot); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
.tile .label { color: var(--text-secondary); font-size: 12px; } .tile .value { font-size: 28px; font-weight: 650; }
.tile .sub { color: var(--text-muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-secondary); padding: 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pname { font-weight: 600; } .pmeta { font-size: 12px; color: var(--text-muted); }
.clickable { cursor: pointer; } .clickable:hover { background: var(--grid); }
.h2h td.slot { text-align: center; font-weight: 600; color: var(--text-secondary); font-size: 12px; background: var(--surface-0); width: 52px; }
.h2h td.r { text-align: right; } .h2h .rec { box-shadow: inset 3px 0 0 var(--me); }
.three td.diffcell { background: var(--hl); } .three tr.totals td { border-top: 2px solid var(--border); vertical-align: top; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); align-items: center; flex-wrap: wrap; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 30; max-width: 320px; }
.loading { padding: 50px; text-align: center; color: var(--text-secondary); }
.scroll { overflow-x: auto; }
.err { color: var(--critical); }
.banner { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--hl); font-size: 13px; }
aside#drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 100vw); background: var(--surface-1);
  border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.2); overflow-y: auto; padding: 18px 20px 40px;
  transform: translateX(105%); transition: transform .18s ease; z-index: 20; color: var(--text-primary); }
aside#drawer.open { transform: none; }
.factor { border-top: 1px solid var(--grid); padding: 8px 0; } .factor .hd { display: flex; justify-content: space-between; font-weight: 600; }
.factor p { margin: 4px 0; } .factor .ev { color: var(--text-muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.kv div { background: var(--surface-0); border-radius: 6px; padding: 6px 8px; } .kv b { display: block; font-size: 16px; }
body { overflow-x: hidden; } .card, #main { min-width: 0; }
@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr; } .viz-root { padding: 12px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .value { font-size: 22px; }
  .bar label { width: 100%; display: flex; gap: 8px; align-items: center; } .bar select { flex: 1; min-width: 0; }
  .bar .spacer { display: none; } #fresh { width: 100%; }
}
</style>
</head>
<body>
<div class="viz-root" id="root">
  <div class="bar">
    <h1 id="title">Start/Sit</h1>
    <span class="spacer"></span>
    <label class="small secondary">Week <select id="week"></select></label>
    <label class="small secondary">Team <select id="team"></select></label>
    <label class="small secondary" id="snapwrap">Snapshot <select id="snap"></select></label>
    <button id="fresh" title="Fetch ESPN projections, injuries and weather now (no odds credits)">Fresh snapshot</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="matchup" class="on">Matchup</button><button data-tab="context">Week context</button><button data-tab="season">Season</button>
  </div>
  <div id="main"><div class="loading">Loading…</div></div>
  <aside id="drawer" aria-label="Player details"></aside>
  <div class="tip" id="tip"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const pct = (x, d = 0) => x == null ? "–" : (100 * x).toFixed(d) + "%";
const pts = (x, d = 1) => x == null || isNaN(x) ? "–" : Number(x).toFixed(d);
const sgn = (x, d = 1) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const when = iso => { if (!iso) return "–"; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}); };
const ago = iso => { if (!iso) return "–"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const tip = $("#tip");
const showTip = (e, h) => { tip.innerHTML = h; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px"; };
const hideTip = () => tip.style.display = "none";
const SLOTS = ["QB", "RB", "RB", "WR", "WR", "TE", "FLEX", "D/ST", "K"];

const S = {weeks: [], teams: [], me: null, week: null, team: null, snapshot: null, tab: "matchup", report: null,
           overrides: {force_in: [], force_out: [], proj_delta: {}}};

function readHash() { const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ["week", "team", "snapshot"]) if (h.get(k)) S[k] = +h.get(k); if (h.get("tab")) S.tab = h.get("tab");
  if (h.get("player")) S.openPlayer = +h.get("player"); }
function writeHash() { const h = new URLSearchParams(); for (const k of ["week", "team", "snapshot"]) if (S[k]) h.set(k, S[k]);
  h.set("tab", S.tab); history.replaceState(null, "", "#" + h); }
const qs = () => { const p = new URLSearchParams(); if (S.week) p.set("week", S.week); if (S.team) p.set("team", S.team);
  if (S.snapshot) p.set("snapshot", S.snapshot); return p.toString(); };
async function getJSON(url, opts) { const r = await (await fetch(url, opts)).json(); if (r.error) throw new Error(r.error); return r; }

async function init() {
  readHash();
  const w = await getJSON("/api/weeks");
  S.weeks = w.weeks; S.teams = w.teams; S.me = w.me;
  S.team = S.team || w.me; S.week = S.week || S.weeks[S.weeks.length - 1].week;
  $("#team").innerHTML = S.teams.map(t => `<option value="${t.id}">${esc(t.name)}${t.id === S.me ? " (you)" : ""}</option>`).join("");
  $("#week").innerHTML = S.weeks.map(x => `<option value="${x.week}">Week ${x.week} · ${x.source === "live" ? "live" : "replay"}</option>`).join("");
  syncControls(); route();
}
function syncControls() {
  $("#team").value = S.team; $("#week").value = S.week;
  const wk = S.weeks.find(x => x.week === S.week), live = wk && wk.source === "live";
  $("#snapwrap").style.display = live ? "" : "none"; $("#fresh").style.display = live ? "" : "none";
  if (live) $("#snap").innerHTML = wk.snapshots.map(s => `<option value="${s.id}">#${s.id} · ${esc(s.slot_key ? s.slot_key.split("-").pop() : "manual")} · ${when(s.started_at)}</option>`).join("");
  if (S.snapshot) $("#snap").value = S.snapshot;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
}
$("#week").onchange = e => { S.week = +e.target.value; S.snapshot = null; resetOverrides(); syncControls(); route(); };
$("#team").onchange = e => { S.team = +e.target.value; resetOverrides(); route(); };
$("#snap").onchange = e => { S.snapshot = +e.target.value; resetOverrides(); route(); };
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; syncControls(); route(); });
$("#fresh").onclick = async () => { const b = $("#fresh"); b.disabled = true; b.textContent = "Taking snapshot…";
  try { const r = await getJSON("/api/snapshot", {method: "POST"}); const w = await getJSON("/api/weeks"); S.weeks = w.weeks;
        S.snapshot = r.snapshot_id; syncControls(); route(); } catch (e) { alert(e.message); }
  finally { b.disabled = false; b.textContent = "Fresh snapshot"; } };
function resetOverrides() { S.overrides = {force_in: [], force_out: [], proj_delta: {}}; }
const hasOverrides = () => S.overrides.force_in.length || S.overrides.force_out.length || Object.keys(S.overrides.proj_delta).length;

async function route() {
  writeHash(); closeDrawer();
  const main = $("#main");
  try {
    if (S.tab === "matchup") {
      main.innerHTML = `<div class="loading">Simulating the matchup 20,000 times…</div>`;
      S.report = hasOverrides()
        ? await getJSON("/api/whatif?" + qs(), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(S.overrides)})
        : await getJSON("/api/report?" + qs());
      renderMatchup(S.report);
      if (S.openPlayer) { const p = [...S.report.players.me, ...S.report.players.opp].find(x => x.id === S.openPlayer); S.openPlayer = null; openDrawer(p); }
    } else if (S.tab === "context") {
      main.innerHTML = `<div class="loading">Loading the week's context…</div>`;
      renderContext(await getJSON("/api/context?" + qs()));
    } else {
      main.innerHTML = `<div class="loading">Loading…</div>`;
      renderSeason(await getJSON("/api/tracking?" + qs()));
    }
  } catch (e) { main.innerHTML = `<div class="loading err">${esc(e.message)}</div>`; }
}

// ------------------------------------------------------------------ shared bits
function statusChips(p) {
  const c = [];
  if (p.locked) c.push(`<span class="chip">Locked · ${pts(p.actual)}</span>`);
  if (p.status === "Out" || p.status === "IR") c.push(`<span class="chip status" style="--dot:var(--critical)">${p.status}</span>`);
  else if (p.status === "Doubtful") c.push(`<span class="chip status" style="--dot:var(--serious)">Doubtful</span>`);
  else if (p.status === "Questionable") c.push(`<span class="chip status" style="--dot:var(--warning)">Questionable</span>`);
  if (p.practice && p.status && p.status !== "none")
    c.push(`<span class="chip">${/Did Not/.test(p.practice) ? "Missed practice" : /Limited/.test(p.practice) ? "Limited practice" : "Full practice"}</span>`);
  if (p.games_back === 1 || p.games_back === 2) c.push(`<span class="chip">${p.games_back === 1 ? "1st" : "2nd"} game back</span>`);
  if (p.unavailable && !p.locked && p.status !== "Out") c.push(`<span class="chip">Unavailable</span>`);
  if (p.nudge) c.push(`<span class="chip status" style="--dot:var(--me)">What-if ${sgn(p.nudge)}</span>`);
  return c.join(" ");
}
function scaleFor(rows) {
  const hi = Math.max(25, ...rows.map(p => p.locked ? p.actual || 0 : p.quantiles.p90));
  const lo = Math.min(0, ...rows.map(p => p.locked ? 0 : p.quantiles.p10));
  return {lo: Math.floor(lo / 5) * 5, hi: Math.ceil(hi / 5) * 5};
}
function rangeSvg(p, sc, side, W = 170) {
  const color = side === "me" ? "var(--me)" : "var(--opp)", soft = side === "me" ? "var(--me-soft)" : "var(--opp-soft)";
  const H = 22, x = v => 6 + (W - 12) * (Math.max(sc.lo, Math.min(sc.hi, v)) - sc.lo) / (sc.hi - sc.lo);
  const grid = []; for (let t = Math.ceil(sc.lo / 10) * 10; t <= sc.hi; t += 10) grid.push(`<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H}" stroke="var(--grid)"/>`);
  if (p.unavailable) return `<svg width="${W}" height="${H}">${grid.join("")}</svg>`;
  if (p.locked) return `<svg width="${W}" height="${H}">${grid.join("")}<circle cx="${x(p.actual || 0)}" cy="${H / 2}" r="5" fill="${color}" stroke="var(--surface-1)" stroke-width="2"/></svg>`;
  const q = p.quantiles;
  const fin = p.final != null ? `<line x1="${x(p.final)}" x2="${x(p.final)}" y1="1" y2="${H - 1}" stroke="var(--text-primary)" stroke-width="1.5" stroke-dasharray="2 2"/>` : "";
  return `<svg width="${W}" height="${H}" class="rng" data-id="${p.id}" role="img" aria-label="${esc(p.name)} 80% range ${pts(q.p10)}–${pts(q.p90)}">${grid.join("")}
    <line x1="${x(q.p10)}" x2="${x(q.p90)}" y1="${H / 2}" y2="${H / 2}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <rect x="${x(q.p25)}" y="${H / 2 - 6}" width="${Math.max(2, x(q.p75) - x(q.p25))}" height="12" rx="4" fill="${soft}" stroke="${color}" stroke-width="1.5"/>
    <line x1="${x(q.p50)}" x2="${x(q.p50)}" y1="${H / 2 - 7}" y2="${H / 2 + 7}" stroke="${color}" stroke-width="2.5"/>
    <path d="M ${x(p.proj)} ${H / 2 - 5} l 4.5 5 l -4.5 5 l -4.5 -5 z" fill="var(--text-primary)" stroke="var(--surface-1)" stroke-width="1.5"/>${fin}</svg>`;
}
function axisSvg(sc, W = 170) {
  const x = v => 6 + (W - 12) * (v - sc.lo) / (sc.hi - sc.lo), t = [];
  for (let v = Math.ceil(sc.lo / 10) * 10; v <= sc.hi; v += 10) t.push(`<text x="${x(v)}" y="10" text-anchor="middle" font-size="10" fill="var(--text-muted)">${v}</text>`);
  return `<svg width="${W}" height="12">${t.join("")}</svg>`;
}
function rangeLegend(replay) {
  return `<div class="legend"><span><svg width="44" height="14"><line x1="2" x2="42" y1="7" y2="7" stroke="var(--me)" stroke-width="2"/><rect x="12" y="2" width="18" height="10" rx="3" fill="var(--me-soft)" stroke="var(--me)" stroke-width="1.5"/><line x1="21" x2="21" y1="1" y2="13" stroke="var(--me)" stroke-width="2.5"/></svg>
    line 10th–90th percentile (80% chance) · box 25th–75th · tick median</span>
    <span><svg width="12" height="14"><path d="M 6 2 l 4.5 5 l -4.5 5 l -4.5 -5 z" fill="var(--text-primary)"/></svg> ESPN projection</span>
    ${replay ? `<span><svg width="14" height="14"><line x1="7" x2="7" y1="1" y2="13" stroke="var(--text-primary)" stroke-width="1.5" stroke-dasharray="2 2"/></svg> actual final score</span>` : ""}
    <span>Click any player for details</span></div>`;
}
function bindRanges(rows) {
  const by = Object.fromEntries(rows.map(p => [p.id, p]));
  document.querySelectorAll("svg.rng").forEach(el => {
    el.onmousemove = e => { const p = by[el.dataset.id]; if (!p) return; const q = p.quantiles, c = p.chance || {};
      showTip(e, `<b>${esc(p.name)}</b><br>ESPN ${pts(p.proj)} · median ${pts(q.p50)}${p.final != null ? ` · final ${pts(p.final)}` : ""}<br>10th ${pts(q.p10)} · 25th ${pts(q.p25)} · 75th ${pts(q.p75)} · 90th ${pts(q.p90)}<br>beats ESPN ${pct(c.beat_proj)} · under 5 ${pct(c.dud)} · 20+ ${pct(c.twenty)}`); };
    el.onmouseleave = hideTip; });
  document.querySelectorAll("[data-player]").forEach(el => el.onclick = () => openDrawer(by[el.dataset.player]));
}

// ------------------------------------------------------------------ matchup tab
function marginChart(r) {
  const {edges, counts, n} = r.margin_hist, W = 620, H = 160, padL = 8, padB = 22;
  const x = v => padL + (W - 2 * padL) * (v - edges[0]) / (edges[edges.length - 1] - edges[0]);
  const ymax = Math.max(...counts), y = c => (H - padB) * (1 - c / ymax);
  const bars = counts.map((c, i) => `<rect class="mbar" data-a="${edges[i]}" data-b="${edges[i + 1]}" data-p="${c / n}" x="${x(edges[i]) + 1}" y="${y(c)}"
      width="${Math.max(1, x(edges[i + 1]) - x(edges[i]) - 2)}" height="${(H - padB) - y(c)}" rx="2" fill="${edges[i] >= 0 ? "var(--win)" : "var(--loss)"}"/>`).join("");
  const ticks = []; for (let v = Math.ceil(edges[0] / 20) * 20; x(v) <= W - 24; v += 20)
    ticks.push(`<text x="${x(v)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${v > 0 ? "+" : ""}${v}</text>`);
  const z = edges[0] < 0 && edges[edges.length - 1] > 0;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Margin distribution; ${pct(r.p_win)} wins">
    <line x1="${padL}" x2="${W - padL}" y1="${H - padB}" y2="${H - padB}" stroke="var(--border)"/>${bars}
    ${z ? `<line x1="${x(0)}" x2="${x(0)}" y1="0" y2="${H - padB}" stroke="var(--text-secondary)" stroke-dasharray="3 3"/>
    <text x="${x(0) + 6}" y="12" font-size="11" fill="var(--text-secondary)">you win →</text>
    <text x="${x(0) - 6}" y="12" font-size="11" text-anchor="end" fill="var(--text-secondary)">← you lose</text>` : ""}${ticks.join("")}</svg>`;
}
function slotLists(rows, side) {
  const start = side === "me" ? rows.filter(p => p.recommended || (p.locked && !["BE", "IR"].includes(p.slot))) : rows.filter(p => p.starting);
  const by = {}; for (const p of start) { const s = side === "me" && p.recommended ? p.rec_slot : p.slot; (by[s] ||= []).push(p); }
  for (const k in by) by[k].sort((a, b) => b.proj - a.proj);
  const out = SLOTS.map(s => (by[s] || []).shift() || null);
  return {slots: out, bench: rows.filter(p => !start.includes(p)).sort((a, b) => b.proj - a.proj)};
}
function cell(p, side, align) {
  if (!p) return side === "me" ? `<td class="muted small">(empty)</td><td></td><td></td><td></td>` : `<td></td><td></td><td></td><td class="muted small r">(empty)</td>`;
  const fin = "";
  const finPill = p.final != null ? `<span class="chip" style="font-weight:650;color:var(--text-primary)">final ${pts(p.final)}</span>` : "";
  const name = `<td class="clickable ${align}" data-player="${p.id}"><div class="pname">${esc(p.name)} ${finPill}</div>
    <div class="pmeta">${esc(p.pos || "")} · ${esc(p.team || "")}${p.opp ? " vs " + esc(p.opp) : " · bye"} · ${p.locked ? "played" : when(p.kickoff)}${fin}</div>
    <div class="chips" style="${align === "r" ? "justify-content:flex-end;" : ""}margin-top:2px">${statusChips(p)}</div></td>`;
  const e = `<td class="num">${pts(p.proj)}</td>`, m = `<td class="num">${p.locked || p.unavailable ? "–" : pts(p.quantiles.p50)}</td>`;
  const rg = `<td class="clickable" data-player="${p.id}">${rangeSvg(p, S.sc, side)}</td>`;
  return side === "me" ? name + e + m + rg : rg + m + e + name;
}
function benchTable(rows, side, title) {
  return `<div class="card scroll"><div class="secondary small">${esc(title)}</div><table>
    <tr><th>Player</th><th class="num">ESPN</th><th class="num">Median</th><th>${axisSvg(S.sc)}</th>${side === "me" ? '<th class="num">P(win) if started</th>' : ""}</tr>

function replayTable(r) {

    model: [...locked.map(p => [p.slot, p]), ...me.filter(p => p.recommended).map(p => [p.rec_slot, p])],

    const p = x.p;
    return `<td class="clickable ${diff ? "diffcell" : ""}" data-player="${p.id}"><div class="pname">${esc(p.name)}</div>
      <div class="pmeta">${esc(p.pos || "")} · ${esc(p.team || "")}${p.locked ? " · locked" : ""} · ESPN ${pts(p.proj)}${showModel && !p.locked && !p.unavailable ? ` · model ${pts(p.model_mean)}` : ""}</div>${why(p)}</td>

    <div class="card scroll"><table class="three">
      <tr><th>Slot</th><th>Highest-projection lineup</th><th class="num">Final</th><th>Model's lineup</th><th class="num">Final</th><th>Actually started</th><th class="num">Final</th></tr>

    </table>

function distSvg(p) {

  const n = ks.length, hi0 = ks[n - 1][1] + (ks[n - 1][1] - ks[n - 2][1]) * (1 - ks[n - 1][0]) / (ks[n - 1][0] - ks[n - 2][0]);

      if (v <= v1) return v1 > v0 ? t0 + (t1 - t0) * (v - v0) / (v1 - v0) : t1; } return 1; };

  const sig = Math.max(0.75, (hi - lo) / 60), w = Math.ceil(3 * sig / step);   // gentle smoothing, ~1-2 pts
  const sm = raw.map((r, i) => { let s = 0, z = 0; for (let j = -w; j <= w; j++) { const k = i + j; if (k < 0 || k >= raw.length) continue;
      const g = Math.exp(-0.5 * (j * step / sig) ** 2); s += g * raw[k].m; z += g; } return {a: r.a, m: s / z}; });

  const mk = (v, label, dash) => `<line x1="${x(v)}" x2="${x(v)}" y1="14" y2="${H - padB}" stroke="var(--text-primary)" stroke-width="1.5" ${dash ? 'stroke-dasharray="3 3"' : ""}/><text x="${x(v) + 4}" y="11" font-size="11" fill="var(--text-secondary)">${label}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribution of ${esc(p.name)}'s points">${bars}
    <line x1="8" x2="${W - 8}" y1="${H - padB}" y2="${H - padB}" stroke="var(--border)"/>${ticks.join("")}
    ${mk(p.proj, "ESPN " + pts(p.proj))}${p.final != null ? mk(p.final, "final " + pts(p.final), true) : ""}</svg>

function whatif(id, kind) {
  const o = S.overrides;
  o.force_in = o.force_in.filter(x => x !== id); o.force_out = o.force_out.filter(x => x !== id);
  if (kind === "in") o.force_in.push(id);
  if (kind === "out") o.force_out.push(id);
  if (kind === "nudge") { const v = +$("#nudge").value; if (v) o.proj_delta[id] = v; else delete o.proj_delta[id]; }
  route();
}

// ------------------------------------------------------------------ week context tab
function renderContext(c) {
  $("#title").textContent = `Start/Sit · Week ${c.week} context`;
  $("#main").innerHTML = `
    <p class="secondary small" style="margin-top:10px">${c.source === "live" ? `Exactly what the archive held at snapshot #${c.snapshot_id}.` : "Replay week: weather measured at game time, closing lines, final injury reports (nflverse)."}</p>
    <h2>Games</h2><div class="card scroll"><table>
      <tr><th>Kickoff</th><th>Game</th><th>Stadium</th><th>Roof</th><th>Weather</th><th class="num">Home line</th><th class="num">O/U</th>${c.source === "replay" ? "<th>Final</th>" : ""}</tr>
      ${c.games.map(g => `<tr><td class="small">${when(g.kickoff)}</td><td>${esc(g.away)} @ ${esc(g.home)}</td><td class="small">${esc(g.stadium)}</td><td class="small">${esc(g.roof || "–")}</td>
        <td class="small">${g.wind != null ? `${Math.round(g.wind)} mph${g.gust ? ` (gusts ${Math.round(g.gust)})` : ""}, ${Math.round(g.temp)}°F${g.precip_prob != null ? `, ${Math.round(g.precip_prob)}% rain` : ""} <span class="muted">· ${esc(g.weather_kind)}</span>` : "–"}</td>
        <td class="num">${g.home_spread != null ? sgn(g.home_spread) : "–"}</td><td class="num">${pts(g.total)}</td>${c.source === "replay" ? `<td>${esc(g.score || "")}</td>` : ""}</tr>`).join("")}</table></div>
    <h2>Offensive line and secondary starters out</h2>
    <p class="small secondary">Starters = 60%+ of snaps in earlier games; out = listed Out/Doubtful or on IR before kickoff.</p>
    <div class="card scroll"><table><tr><th>Team</th><th>Unit</th><th>Who</th></tr>
      ${c.lines.map(l => `<tr><td>${esc(l.team)}</td><td>${esc(l.unit)}</td><td class="small">${esc(l.who)}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">None</td></tr>`}</table></div>
    <h2>Injury report</h2>
    <div class="bar" style="margin-bottom:6px"><input id="injq" placeholder="Filter by team or player" style="width:240px"><span class="small muted">${c.injuries.length} entries</span></div>
    <div class="card scroll"><table id="injt"><tr><th>Team</th><th>Player</th><th>Pos</th><th>Game status</th><th>Practice</th><th>Injury</th></tr>
      ${c.injuries.sort((a, b) => (a.team || "").localeCompare(b.team || "")).map(i => `<tr data-k="${esc(((i.team || "") + " " + (i.full_name || "")).toLowerCase())}"><td>${esc(i.team)}</td><td>${esc(i.full_name)}</td><td>${esc(i.position)}</td>
        <td>${esc(i.report_status || "–")}</td><td class="small">${esc((i.practice_status || "").replace(" Participation in Practice", "").replace(" In Practice", ""))}</td><td class="small">${esc(i.injury || "")}</td></tr>`).join("")}</table></div>
    ${c.espn_status && c.espn_status.length ? `<h2>ESPN designations (fantasy-relevant players)</h2><div class="card scroll"><table><tr><th>Player</th><th>Team</th><th>Pos</th><th>Status</th></tr>
      ${c.espn_status.map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.team)}</td><td>${esc(i.pos)}</td><td>${esc(i.status)}</td></tr>`).join("")}</table></div>` : ""}`;
  $("#injq").oninput = e => { const v = e.target.value.toLowerCase(); document.querySelectorAll("#injt tr[data-k]").forEach(tr => tr.style.display = tr.dataset.k.includes(v) ? "" : "none"); };
}

// ------------------------------------------------------------------ season tab
function renderSeason(t) {
  $("#title").textContent = `Start/Sit · ${t.team.name} season`;
  const w = t.weeks, sum = k => w.reduce((s, x) => s + (x[k] || 0), 0);
  $("#main").innerHTML = `
    <p class="secondary small" style="margin-top:10px">Each completed week replayed as of Sunday 11:45 ET: the model's lineup vs. the highest-projection lineup vs. what the team started, all scored on actual results. Live weeks join once final scores are archived (Tuesday).</p>
    <div class="tiles">
      <div class="card tile"><div class="label">Record with the lineups started</div><div class="value">${w.filter(x => x.won).length}–${w.filter(x => !x.won).length}</div></div>
      <div class="card tile"><div class="label">Record with the model's lineups</div><div class="value">${w.filter(x => x.model_would_win).length}–${w.filter(x => !x.model_would_win).length}</div></div>
      <div class="card tile"><div class="label">Points: started vs model</div><div class="value">${pts(sum("actual_points"), 0)} / ${pts(sum("model_points"), 0)}</div><div class="sub">highest projection ${pts(sum("maxproj_points"), 0)}</div></div>
      <div class="card tile"><div class="label">Weeks the model would change something</div><div class="value">${w.filter(x => x.differs).length} of ${w.length}</div></div>
    </div>
    <div class="card scroll" style="margin-top:10px"><table>
      <tr><th>Week</th><th>Opponent</th><th class="num">Started</th><th class="num">Model</th><th class="num">Highest proj.</th><th class="num">Opponent</th><th>Result</th><th>Model would</th><th class="num">Model P(win)</th><th></th></tr>
      ${w.map(x => `<tr class="clickable" onclick="S.week=${x.week};S.tab='matchup';S.snapshot=null;syncControls();route()"><td>${x.week}</td><td>${esc(x.opponent)}</td>
        <td class="num">${pts(x.actual_points)}</td><td class="num">${pts(x.model_points)}</td><td class="num">${pts(x.maxproj_points)}</td><td class="num">${pts(x.opp_points)}</td>
        <td>${x.won ? "Won" : "Lost"}</td><td>${x.model_would_win ? "win" : "lose"}</td><td class="num">${pct(x.model_pwin)}</td><td class="small muted">${x.differs ? "model differs" : ""}</td></tr>`).join("")}
    </table></div>
    <p class="small muted">Click a week to open its matchup.</p>`;
}
init().catch(e => $("#main").innerHTML = `<div class="loading err">${esc(e.message)}</div>`);
</script>
</body>
</html>
